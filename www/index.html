<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Arrowfish</title><link rel="stylesheet" href="style.css"></head><body>
<header><img src="icons/icon-192.png" alt=""><h1>Arrowfish</h1></header>
<div id="wrap"><div id="board"></div><svg id="arrows" viewBox="0 0 8 8"></svg></div>
<p id="status"></p>
<div id="bar">
  <button id="new">New</button><button id="undo">Undo</button><button id="flip">Flip</button>
  <label><input type="checkbox" id="hint" checked> Arrow</label>
  <select id="mode"><option value="ai">vs Computer</option><option value="two">Analysis (both sides)</option></select>
  <select id="side"><option value="w">Play White</option><option value="b">Play Black</option></select>
  <select id="level"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
</div>
<script type="module" src="app.js"></script></body></html>
